name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=prs_merged,prs_merged_percentage,reviews&line_height=30&card_width=600&rank_icon=github&hide_border=true&bg_color=020617&title_color=22D3EE&icon_color=7DD3FC&text_color=94A3B8&ring_color=22D3EE&locale=pt-br"
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=typescript,javascript,css,html&hide_border=true&bg_color=020617&title_color=22D3EE&text_color=94A3B8&locale=pt-br"
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit --amend --no-edit
          git push --force
