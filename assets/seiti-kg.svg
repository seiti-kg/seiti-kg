<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="o-t">
  <title id="o-t">Seiti — back-end developer. Gráfico de barras sobre a régua.</title>
  <defs>
    <clipPath id="o-clip"><rect width="960" height="320" rx="18"/></clipPath>
    <radialGradient id="o-glow" cx="45%" cy="-10%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .o-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .o-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .o-rule { stroke-dasharray: 866; stroke-dashoffset: 866; animation: o-draw 1.5s .15s cubic-bezier(.2,.8,.2,1) forwards; }
    .o-accent { stroke-dasharray: 52; stroke-dashoffset: 52; animation: o-draw 1.1s .9s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes o-draw { to { stroke-dashoffset: 0; } }
    .o-rise { animation: o-rise .95s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes o-rise { from { opacity: 0; transform: translateY(12px); } }
    .o-ph { opacity: 0; animation: o-cycle 18s infinite; }
    .o-p2 { animation-delay: 4.5s; }
    .o-p3 { animation-delay: 9s; }
    .o-p4 { animation-delay: 13.5s; }
    @keyframes o-cycle {
      0%        { opacity: 0; transform: translateY(7px); }
      4%, 22%   { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-7px); }
    }
    .o-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: o-pulse 6.4s ease-in-out infinite; }
    @keyframes o-pulse { 0%, 100% { transform: scaleY(.82); } 50% { transform: scaleY(1); } }
  </style>

  <g clip-path="url(#o-clip)">
    <rect width="960" height="320" fill="#09090b"/>
    <rect width="960" height="320" fill="url(#o-glow)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <g class="o-rise">
    <text x="912" y="44" text-anchor="end" class="o-mono" font-size="10" letter-spacing="3.2" fill="#71717a">BACK-END DEVELOPER</text>
    <line x1="48" y1="60" x2="912" y2="60" stroke="#ffffff" stroke-opacity=".08"/>
  </g>

  <text x="44" y="176" class="o-sans o-rise" style="animation-delay:.05s" font-size="92" font-weight="700" letter-spacing="-4" fill="#fafafa">Seiti</text>

  <g class="o-rise" style="animation-delay:.12s">
    <line class="o-rule" x1="46" y1="200" x2="912" y2="200" stroke="#ffffff" stroke-opacity=".13"/>
    <line class="o-accent" x1="46" y1="200" x2="98" y2="200" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="o-sans" font-size="18" fill="#a1a1aa">
    <text class="o-ph" x="46" y="244">Python · LangGraph · FastAPI · Qdrant · vLLM</text>
    <text class="o-ph o-p2" x="46" y="244">Agentes autônomos e fluxos ReAct com LangGraph</text>
    <text class="o-ph o-p3" x="46" y="244">Engenharia de IA determinística e observável</text>
    <text class="o-ph o-p4" x="46" y="244">Pipelines vetoriais e busca semântica em escala</text>
  </g>

  <g fill="#4b5563">
    <rect class="o-bar" x="642" y="172" width="3" height="28" rx="1.5" style="animation-delay:-.1s"/>
    <rect class="o-bar" x="666" y="158" width="3" height="42" rx="1.5" style="animation-delay:-1.4s"/>
    <rect class="o-bar" x="690" y="178" width="3" height="22" rx="1.5" style="animation-delay:-2.6s"/>
    <rect class="o-bar" x="714" y="144" width="3" height="56" rx="1.5" style="animation-delay:-.8s"/>
    <rect class="o-bar" x="738" y="166" width="3" height="34" rx="1.5" style="animation-delay:-2s"/>
    <rect class="o-bar" x="762" y="132" width="3" height="68" rx="1.5" fill="#34d399" style="animation-delay:-3.1s"/>
    <rect class="o-bar" x="786" y="156" width="3" height="44" rx="1.5" style="animation-delay:-1.1s"/>
    <rect class="o-bar" x="810" y="174" width="3" height="26" rx="1.5" style="animation-delay:-2.3s"/>
    <rect class="o-bar" x="834" y="142" width="3" height="58" rx="1.5" style="animation-delay:-.5s"/>
    <rect class="o-bar" x="858" y="162" width="3" height="38" rx="1.5" style="animation-delay:-1.8s"/>
    <rect class="o-bar" x="882" y="152" width="3" height="48" rx="1.5" style="animation-delay:-2.9s"/>
  </g>

  <text x="912" y="292" text-anchor="end" class="o-mono o-rise" style="animation-delay:.36s" font-size="10.5" fill="#a1a1aa">github.com/seiti-kg</text>
</svg>
